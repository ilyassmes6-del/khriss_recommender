services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khriss
      POSTGRES_PASSWORD: khriss
      POSTGRES_DB: khriss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khriss"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file: .env
    environment:
      # Override the .env host defaults with the compose service names.
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://khriss:khriss@postgres:5432/khriss
      KHRISS_CHECKPOINT: /app/data/index_checkpoint.json
    ports:
      - "8000:8000"
    volumes:
      # Persist the resume checkpoint across restarts.
      - ./data:/app/data

volumes:
  pgdata:
  qdrantdata:
