# The storefront widget lives at the Python project root, not under
# extensions/. `shopify app config link` regenerates this file from the remote
# app and drops this line, so re-add it after any relink -- without it the
# deploy silently ships an app with no extension.
extension_directories = [ "extensions/*", "../theme-extension" ]
application_url = "https://example.com"
embedded = true

